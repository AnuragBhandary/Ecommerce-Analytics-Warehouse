[project]
name = "olistwh"
version = "1.0.0"
description = "E-commerce analytics warehouse: a MySQL source simulator, watermark-based incremental EL into PostgreSQL, dbt star schema with SCD2, Airflow orchestration and reconciliation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Anurag Bhandary" }]
dependencies = [
    "pandas>=2.2",
    "pymysql>=1.1",
    "psycopg[binary]>=3.2",
]

[project.scripts]
olistwh = "olistwh.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "types-pymysql>=1.1",
]
dbt = [
    "dbt-core>=1.9,<1.10",
    "dbt-postgres>=1.9,<1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olistwh"]

[tool.uv]
default-groups = ["dev", "dbt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: needs the MySQL and PostgreSQL containers (make infra)"]

[tool.coverage.run]
source = ["olistwh"]
omit = ["*/olistwh/__main__.py"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "airflow", "metabase"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.12"
packages = ["olistwh"]
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
