# Local stack. Every password here is a throwaway dev credential (see .env.example).
#   mysql      operational source (Olist replayed by the simulator)
#   postgres   warehouse (raw, staging, snapshots, marts) + Airflow and Metabase metadata
#   airflow-*  orchestration: extract_load -> dbt snapshot -> dbt run -> dbt test -> reconcile
#   metabase   live dashboards on the marts
#   simulator  optional (profile "live"): keeps the source moving forward in business time

x-airflow: &airflow
  build: { context: ., dockerfile: docker/airflow/Dockerfile }
  image: olistwh-airflow:latest
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "30"
    AIRFLOW__WEBSERVER__SECRET_KEY: local-dev-only
    MYSQL_HOST: mysql
    MYSQL_PORT: "3306"
    WAREHOUSE_DSN: postgresql://warehouse:warehouse@postgres:5432/warehouse
    DBT_HOST: postgres
    DBT_PORT: "5432"
    OLIST_DATA_DIR: /opt/olistwh/data
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./warehouse:/opt/olistwh/warehouse
    - ./data:/opt/olistwh/data:ro
  depends_on:
    postgres: { condition: service_healthy }
    mysql: { condition: service_healthy }

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: olist
      MYSQL_USER: olist
      MYSQL_PASSWORD: olist
    command: ["--binlog-format=ROW", "--default-time-zone=+00:00"]
    ports: ["3307:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uolist", "-polist"]
      interval: 3s
      timeout: 3s
      retries: 40

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
      POSTGRES_DB: warehouse
    ports: ["5433:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "warehouse"]
      interval: 3s
      timeout: 3s
      retries: 40

  airflow-init:
    <<: *airflow
    command: >
      bash -c "airflow db migrate &&
               airflow users create --username admin --password admin --firstname Local
               --lastname Admin --role Admin --email admin@example.com || true"
    restart: "no"

  airflow-webserver:
    <<: *airflow
    command: webserver
    ports: ["8080:8080"]
    depends_on:
      airflow-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--local"]
      interval: 15s
      timeout: 10s
      retries: 20

  metabase:
    image: metabase/metabase:v0.52.13
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: "5432"
      MB_DB_USER: metabase
      MB_DB_PASS: metabase
      MB_DB_HOST: postgres
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 40

  simulator:
    <<: *airflow
    profiles: ["live"]
    entrypoint: ["python", "-m", "olistwh", "sim", "run", "--step-hours", "6", "--interval", "20"]
    command: []

volumes:
  mysql-data:
  pg-data:
