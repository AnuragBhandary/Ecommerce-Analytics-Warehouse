# Credentials come from the environment; defaults are the local docker-compose ones.
olist_warehouse:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', '127.0.0.1') }}"
      port: "{{ env_var('DBT_PORT', '5433') | int }}"
      user: "{{ env_var('DBT_USER', 'warehouse') }}"
      password: "{{ env_var('DBT_PASSWORD', 'warehouse') }}"
      dbname: "{{ env_var('DBT_DBNAME', 'warehouse') }}"
      schema: analytics
      threads: 4
