version: 2

models:
  - name: stg_orders
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_unique_id
        tests: [not_null]
      - name: purchased_at
        tests: [not_null]
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values: [created, approved, invoiced, processing, shipped, delivered, canceled, unavailable]

  - name: stg_order_items
    tests:
      - unique_combination: { columns: [order_id, order_item_id] }
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships: { to: ref('stg_orders'), field: order_id }
      - name: product_id
        tests:
          - relationships: { to: ref('stg_products'), field: product_id }
      - name: seller_id
        tests:
          - relationships: { to: ref('stg_sellers'), field: seller_id }
      - name: price
        tests: [not_null, non_negative]
      - name: freight_value
        tests: [not_null, non_negative]

  - name: stg_payments
    tests:
      - unique_combination: { columns: [order_id, payment_sequential] }
    columns:
      - name: order_id
        tests:
          - relationships: { to: ref('stg_orders'), field: order_id }
      - name: payment_type
        tests:
          - accepted_values:
              values: [credit_card, boleto, voucher, debit_card, not_defined]
      - name: payment_value
        tests: [not_null, non_negative]

  - name: stg_reviews
    description: One row per (review_id, order_id); score stays null until the survey is answered.
    tests:
      - unique_combination: { columns: [review_id, order_id] }
    columns:
      - name: order_id
        tests:
          - relationships: { to: ref('stg_orders'), field: order_id }
      - name: score
        tests:
          - between: { min_value: 1, max_value: 5 }

  - name: stg_products
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: category
        tests: [not_null]

  - name: stg_sellers
    columns:
      - name: seller_id
        tests: [unique, not_null]
      - name: state
        tests: [not_null]
